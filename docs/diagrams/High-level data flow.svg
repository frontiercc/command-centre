nt-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">scheduled jobs</text><path d="M640,482 a95,12 0 0,1 190,0 v96 a95,12 0 0,1 -190,0 z" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><path d="M640,482 a95,12 0 0,0 190,0" fill="none" stroke="#3A58EE" stroke-width="2"/><text x="735" y="536" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">PostgreSQL</text><text x="735" y="560" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">bundled or managed</text><rect x="340" y="600" width="200" height="92" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2" /><text x="440" y="641.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Reverse proxy</text><text x="440" y="665.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">you provide, for HTTPS</text><rect x="900" y="40" width="280" height="690" rx="14" fill="none" stroke="#C2552E" stroke-width="2" stroke-dasharray="10 7"/><text x="918" y="70" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#C2552E" text-anchor="start">Anthropic</text><rect x="915" y="140" width="250" height="110" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2" /><text x="1040" y="180" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude API</text><text x="1040" y="204" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">receives prompts and</text><text x="1040" y="224" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">aggregates for AI features</text><rect x="915" y="430" width="250" height="110" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2" /><text x="1040" y="470" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Compliance API</text><text x="1040" y="494" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">Enterprise plan; Hub</text><text x="1040" y="514" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">pulls Claude Chat, read only</text><path d="M250,136 L340,160" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M250,276 L340,200" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><rect x="355" y="256" width="170" height="43" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="440" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">OTLP, bearer token,</text><text x="440" y="289.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">HTTPS via your proxy</text><path d="M540,175 L630,175" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><rect x="551.05" y="202" width="67.9" height="25.5" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="585" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">batched</text><path d="M735,370 L735,470" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" marker-start="url(#ta)"/><rect x="761.45" y="409" width="37.1" height="25.5" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="780" y="425" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">TLS</text><path d="M250,646 L340,646" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M440,600 L440,420 L670,420 L670,372" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><rect x="528.75" y="396" width="52.5" height="25.5" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="555" y="412" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">HTTPS</text><path d="M840,195 L915,195" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M915,485 L885,485 L885,330 L840,330" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M20,476 L8,476 L8,790 L1040,790 L1040,540" fill="none" stroke="#5B5D73" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#hm)" /><rect x="245" y="767" width="630" height="25.5" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="560" y="783" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#5B5D73" text-anchor="middle">Claude Chat conversations are held by Anthropic and exported through the Compliance API</text><text x="600" y="845" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">Nothing flows from Command Centre back to any Claude client.</text><rect x="30" y="878" width="26" height="18" rx="4" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="66" y="892" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">This repository</text><rect x="241" y="878" width="26" height="18" rx="4" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="277" y="892" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">You provide</text><rect x="416" y="878" width="26" height="18" rx="4" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="452" y="892" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">Anthropic</text></svg>