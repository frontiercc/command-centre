<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A58EE"/></marker></defs><rect width="1200" height="1140" fill="#FFFFFF"/><rect x="20" y="20" width="1160" height="1040" rx="14" fill="none" stroke="#B26B00" stroke-width="2" stroke-dasharray="10 7"/><text x="38" y="50" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#B26B00" text-anchor="start">Your Azure subscription, one region</text><rect x="250" y="70" width="300" height="70" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2" /><text x="400.0" y="100.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">TLS certificates</text><text x="400.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">managed, or from Key Vault</text><rect x="580" y="70" width="260" height="70" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2" /><text x="710.0" y="100.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Your DNS</text><text x="710.0" y="124.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">hub and collector names</text><rect x="220" y="170" width="700" height="780" rx="14" fill="none" stroke="#1C1D2F" stroke-width="2" stroke-dasharray="10 7"/><text x="222" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1D2F" text-anchor="start">Virtual network</text><rect x="235" y="215" width="670" height="115" rx="8" fill="#F5F4FC" stroke="#C9CBD9"/><text x="890" y="239" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B5