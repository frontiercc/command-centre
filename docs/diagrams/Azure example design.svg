><text x="570.0" y="439.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">HTTPS: 443 to the Hub, 4318 or 443 to the collector</text><rect x="250" y="480" width="190" height="70" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2" /><text x="345.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Hub replica</text><text x="345.0" y="534.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">port 3000</text><rect x="475" y="480" width="190" height="70" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2" /><text x="570.0" y="510.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Hub replica</text><text x="570.0" y="534.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">port 3000</text><rect x="250" y="590" width="190" height="70" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2" /><text x="345.0" y="620.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Collector replica</text><text x="345.0" y="644.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">ports 4318, 13133</text><rect x="475" y="590" width="190" height="70" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2" /><text x="570.0" y="620.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Collector replica</text><text x="570.0" y="644.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">ports 4318, 13133</text><rect x="700" y="480" width="185" height="8