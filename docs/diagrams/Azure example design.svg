nter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">over TLS</text><rect x="30" y="640" width="175" height="170" rx="10" fill="#F5F5F5" stroke="#8F8F8F" stroke-width="2" /><text x="117.5" y="689" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">External</text><text x="117.5" y="715" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">Anthropic, GitHub,</text><text x="117.5" y="739" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">SMTP, Slack, IdP,</text><text x="117.5" y="763" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">reached through</text><text x="117.5" y="787" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">the outbound path</text><path d="M205,275 L248,275" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M205,395 L230,395 L230,295 L248,295" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M400,315 L400,388" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M346,450 L346,478" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M570,450 L570,478" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M346,590 L346,552" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><rect x="350" y="563" width="72" height="24.25" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="354" y="578" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="start">telemetry</text><path d="M665,515 L698,515" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M440,515 L452,515 L452,800 L442,800" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><rect x="458" y="713" width="66" height="24.25" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="462" y="728" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="start">5432 TLS</text><path d="M665,625 L793,625 L793,753" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><text x="600" y="990" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">Network security groups: ingress to the apps only; the database, storage, Key Vault and registry only through private endpoints.</text><text x="600" y="1015" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">Public network access is off on every data service. Each app reads its secrets through its own managed identity.</text><rect x="30" y="1098" width="26" height="18" rx="4" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="66" y="1112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">This repository</text><rect x="241" y="1098" width="26" height="18" rx="4" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="277" y="1112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">You provide</text><rect x="416" y="1098" width="26" height="18" rx="4" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="452" y="1112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">Anthropic</text><rect x="573" y="1098" width="26" height="18" rx="4" fill="#F5F5F5" stroke="#8F8F8F" stroke-width="2"/><text x="609" y="1112" font-family="Inter, 'Segoe UI', Arial, sans-serif" 