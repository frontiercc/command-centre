<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A58EE"/></marker></defs><rect width="1200" height="790" fill="#FFFFFF"/><text x="200" y="40" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1D2F" text-anchor="middle">On your computer</text><text x="200" y="64" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">Trying it with sample data</text><text x="600" y="40" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1D2F" text-anchor="middle">On one server</text><text x="600" y="64" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">Your organisation</text><text x="1000" y="40" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1D2F" text-anchor="middle">On AWS or Azure</text><text x="1000" y="64" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">Your organisation, on managed cloud services</text><rect x="20" y="86" width="360" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="200.0" y="112.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Sample data</text><text x="200.0" y="134.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">a fictional company, Acme Corp</text><rect x="420" y="86" width="205" height="60" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="522.5" y="110" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude Code, Cowork,</text><text x="522.5" y="131" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1D2F" text-anchor="middle">Office and Google</text><rect x="635" y="86" width="145" height="60" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="707.5" y="112.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude Chat</text><text x="707.5" y="134.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">Enterprise</text><rect x="820" y="86" width="205" height="60" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="922.5" y="110" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude Code, Cowork,</text><text x="922.5" y="131" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1D2F" text-anchor="middle">Office and Google</text><rect x="1035" y="86" width="145" height="60" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="1107.5" y="112.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude Chat</text><text x="1107.5" y="134.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">Enterprise</text><rect x="20" y="175" width="360" height="380" rx="14" fill="none" stroke="#B26B00" stroke-width="2" stroke-dasharray="10 7"/><text x="36" y="539" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#B26B00" text-anchor="start">Your computer, with Docker</text><rect x="50" y="225" width="260" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="180.0" y="261.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Collector</text><path d="M180,285 L180,327" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="330" width="260" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="180.0" y="356.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Hub</text><text x="180.0" y="378.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">the web app you sign in to</text><path d="M345,146 L345,470 L313,470" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><path d="M180,390 L180,432" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="435" width="260" height="70" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="180.0" y="466.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">PostgreSQL</text><text x="180.0" y="488.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">included</text><rect x="420" y="175" width="360" height="380" rx="14" fill="none" stroke="#B26B00" stroke-width="2" stroke-dasharray="10 7"/><text x="436" y="539" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#B26B00" text-anchor="start">Your server, with Docker</text><path d="M522,146 L522,222" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="450" y="225" width="300" height="60" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="600.0" y="251.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Reverse proxy</text><text x="600.0" y="273.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">HTTPS, such as Caddy</text><path d="M515,285 L515,327" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><path d="M685,285 L685,327" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="450" y="330" width="130" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="515.0" y="366.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Collector</text><path d="M580,360 L617,360" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="620" y="330" width="130" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="685.0" y="366.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Hub</text><path d="M757,146 L757,360 L753,360" fill="none" stroke="#3A58EE" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M685,390 L685,432" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="450" y="435" width="300" height="70" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="600.0" y="466.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">PostgreSQL</text><text x="600.0" y="488.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">included, or your own</text><rect x="820" y="175" width="360" height="380" rx="14" fill="none" stroke="#B26B00" stroke-width="2" stroke-dasharray="10 7"/><text x="836" y="539" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#B26B00" text-anchor="start">Your cloud account</text><path d="M922,146 L922,222" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="850" y="225" width="300" height="60" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="1000.0" y="251.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Load balancer</text><text x="1000.0" y="273.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">HTTPS</text><path d="M915,285 L915,327" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><path d="M1085,285 L1085,327" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="850" y="330" width="130" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="915.0" y="366.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Collector</text><path d="M980,360 L1017,360" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="1020" y="330" width="130" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="1085.0" y="366.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Hub</text><path d="M1158,146 L1158,360 L1153,360" fill="none" stroke="#3A58EE" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M1050,390 L965,432" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="850" y="435" width="130" height="70" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="915.0" y="466.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">PostgreSQL</text><text x="915.0" y="488.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">managed</text><rect x="1020" y="435" width="130" height="70" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="1085.0" y="466.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Secrets</text><text x="1085.0" y="488.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">secret store</text><text x="600" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">On your computer, the sample data is loaded straight into PostgreSQL; nothing is connected to Claude or OpenAI.</text><text x="600" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">Solid: Claude Code, Claude Cowork and Claude in Office/Google send their activity to the collector.</text><text x="600" y="700" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">Dashed: the Hub reads Claude Chat from Anthropic’s Compliance API (Claude for Enterprise), and ChatGPT and Codex from OpenAI’s Compliance API (Enterprise or Edu).</text><rect x="30" y="738" width="26" height="18" rx="4" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="66" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">This repository</text><rect x="241" y="738" width="26" height="18" rx="4" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="277" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">You provide</text><rect x="416" y="738" width="26" height="18" rx="4" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="452" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">Anthropic</text><rect x="603" y="572" width="177" height="60" rx="10" fill="#E6F4EE" stroke="#2E7D5B" stroke-width="2"/><text x="691.5" y="597" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1C1D2F" text-anchor="middle">ChatGPT and Codex</text><text x="691.5" y="618" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">Enterprise or Edu</text><path d="M766,572 L766,378 L753,378" fill="none" stroke="#3A58EE" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="1003" y="572" width="177" height="60" rx="10" fill="#E6F4EE" stroke="#2E7D5B" stroke-width="2"/><text x="1091.5" y="597" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1C1D2F" text-anchor="middle">ChatGPT and Codex</text><text x="1091.5" y="618" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">Enterprise or Edu</text><path d="M1166,572 L1166,378 L1153,378" fill="none" stroke="#3A58EE" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="572" y="738" width="26" height="18" rx="4" fill="#E6F4EE" stroke="#2E7D5B" stroke-width="2"/><text x="608" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">OpenAI</text></svg>