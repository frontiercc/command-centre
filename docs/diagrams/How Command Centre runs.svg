ont-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">included, or your own</text><rect x="820" y="175" width="360" height="380" rx="14" fill="none" stroke="#B26B00" stroke-width="2" stroke-dasharray="10 7"/><text x="836" y="539" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#B26B00" text-anchor="start">Your cloud account</text><path d="M922,146 L922,222" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="850" y="225" width="300" height="60" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="1000.0" y="251.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Load balancer</text><text x="1000.0" y="273.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B5D73" text-anchor="middle">HTTPS</text><path d="M915,285 L915,327" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><path d="M1085,285 L1085,327" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="850" y="330" width="130" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="915.0" y="366.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Collector</text><path d="M980,360 L1017,360" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="1020" y="330" width="130" height="60" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="1085.0" y="366.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1D2F" text-anchor="middle">Hub</text><path d="M1165,146 L1165,360 L1153,360" fill="none" stroke="#3A58EE" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M1050,390 L965,432" fill="none" stroke="#3A58EE" stroke-width="2.5" marker-end="url(#a)"/><rect x="850" y="435" width