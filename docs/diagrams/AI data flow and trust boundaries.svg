<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A58EE"/></marker><marker id="ta" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3A58EE"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B5D73"/></marker><marker id="tm" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5B5D73"/></marker></defs><rect width="1200" height="940" fill="#FFFFFF"/><rect x="10" y="90" width="240" height="420" rx="14" fill="none" stroke="#1C1D2F" stroke-width="2" stroke-dasharray="10 7"/><text x="28" y="120" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1D2F" text-anchor="start">Employee devices</text><rect x="280" y="90" width="600" height="640" rx="14" fill="none" stroke="#B26B00" stroke-width="2" stroke-dasharray="10 7"/><text x="298" y="120" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#B26B00" text-anchor="start">Your infrastructure</text><rect x="905" y="90" width="285" height="420" rx="14" fill="none" stroke="#C2552E" stroke-width="2" stroke-dasharray="10 7"/><text x="923" y="120" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#C2552E" text-anchor="start">Anthropic</text><rect x="30" y="150" width="200" height="110" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2" /><text x="130" y="200.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude Cowork</text><text x="130" y="224.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">in Claude Desktop</text><rect x="30" y="330" width="200" height="100" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2" /><text x="130" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude Code</text><rect x="305" y="150" width="190" height="230" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2" /><text x="400" y="260.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Reverse proxy</text><text x="400" y="284.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">you provide, for HTTPS</text><rect x="560" y="150" width="180" height="90" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2" /><text x="650" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Collector</text><rect x="560" y="290" width="180" height="120" rx="10" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2" /><text x="650" y="335" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Hub</text><text x="650" y="359" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">AI features run</text><text x="650" y="379" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">here</text><rect x="775" y="300" width="85" height="90" rx="10" fill="#FFFFFF" stroke="#1C1D2F" stroke-width="2" /><text x="817.5" y="351" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1C1D2F" text-anchor="middle">Outbound</text><path d="M560,572 a100,12 0 0,1 200,0 v106 a100,12 0 0,1 -200,0 z" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><path d="M560,572 a100,12 0 0,0 200,0" fill="none" stroke="#3A58EE" stroke-width="2"/><text x="660" y="631" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">PostgreSQL</text><text x="660" y="655" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">prompts as text;</text><text x="660" y="675" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">replies never stored</text><rect x="305" y="570" width="190" height="110" rx="10" fill="#FFF6E5" stroke="#B26B00" stroke-width="2" /><text x="400" y="620.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Secrets</text><text x="400" y="644.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">.env or secret store</text><rect x="925" y="140" width="245" height="110" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2" /><text x="1047.5" y="190.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Claude models</text><text x="1047.5" y="214.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">inference</text><rect x="925" y="330" width="245" height="110" rx="10" fill="#FBEDE7" stroke="#C2552E" stroke-width="2" /><text x="1047.5" y="362" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Read-only APIs</text><text x="1047.5" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">Compliance (Claude Chat);</text><text x="1047.5" y="406" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">Analytics, Admin</text><text x="1047.5" y="426" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">(on the roadmap)</text><rect x="925" y="600" width="245" height="110" rx="10" fill="#F5F5F5" stroke="#8F8F8F" stroke-width="2" stroke-dasharray="8 6"/><text x="1047.5" y="640" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1D2F" text-anchor="middle">Services you choose</text><text x="1047.5" y="664" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">Slack, SMTP, GitHub,</text><text x="1047.5" y="684" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B5D73" text-anchor="middle">S3 archive, identity provider</text><path d="M205,150 L205,55 L1048,55 L1048,140" fill="none" stroke="#5B5D73" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#hm)" /><rect x="305.79999999999995" y="32" width="568.4000000000001" height="25.5" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="590" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#5B5D73" text-anchor="middle">prompts in normal use of Claude, Claude Chat included, go straight to Anthropic</text><path d="M230,205 L305,205" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M230,380 L270,380 L270,300 L305,300" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><rect x="65.25" y="454" width="129.5" height="43" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="130" y="470" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">OTLP telemetry,</text><text x="130" y="487.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#3A58EE" text-anchor="middle">bearer token</text><path d="M495,195 L560,195" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M650,240 L650,290" fill="none" stroke="#3A58EE" stroke-width="2"  marker-end="url(#ha)" /><rect x="700" y="253" width="92.65" height="24.25" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="707" y="268" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="start">private network</text><path d="M650,410 L650,560" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" marker-start="url(#ta)"/><path d="M495,625 L530,625 L530,390 L560,390" fill="none" stroke="#5B5D73" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#hm)" /><path d="M740,345 L775,345" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><path d="M860,320 L890,320 L890,195 L925,195" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" /><rect x="847.25" y="270" width="85.5" height="56.75" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="890" y="285" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="middle">masked</text><text x="890" y="301.25" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="middle">excerpts,</text><text x="890" y="317.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="middle">aggregates</text><path d="M860,370 L925,385" fill="none" stroke="#3A58EE" stroke-width="2.5"  marker-end="url(#ha)" marker-start="url(#ta)"/><rect x="772.1" y="399" width="99.80000000000001" height="56.75" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="822" y="414" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="middle">keys and</text><text x="822" y="430.25" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="middle">cursors out,</text><text x="822" y="446.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#3A58EE" text-anchor="middle">data in</text><path d="M740,400 L760,400 L760,520 L895,520 L895,655 L925,655" fill="none" stroke="#5B5D73" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#hm)" /><text x="600" y="790" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">Only the Hub calls out. Masking removes structured personal data and secrets; it does not remove names.</text><text x="600" y="815" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B5D73" text-anchor="middle">The intent and personal-data checks send the matched prompt as written, because they must judge its context.</text><rect x="30" y="898" width="26" height="18" rx="4" fill="#EEF1FD" stroke="#3A58EE" stroke-width="2"/><text x="66" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">This repository</text><rect x="241" y="898" width="26" height="18" rx="4" fill="#FFF6E5" stroke="#B26B00" stroke-width="2"/><text x="277" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">You provide</text><rect x="416" y="898" width="26" height="18" rx="4" fill="#FBEDE7" stroke="#C2552E" stroke-width="2"/><text x="452" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">Anthropic</text><rect x="573" y="898" width="26" height="18" rx="4" fill="#F5F5F5" stroke="#8F8F8F" stroke-width="2"/><text x="609" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1C1D2F" text-anchor="start">Other services you choose</text></svg>