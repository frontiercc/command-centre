# Known dependency advisories that do not affect Command Centre, each with the
# reason. OpenSSF Scorecard and OSV-Scanner read this file. Every entry was
# checked against the code; fixing any of them needs a major upgrade (Next.js 16,
# Tailwind 4, vitest 5 or a newer Anthropic SDK), which will clear it. Remove an
# entry once the upgrade lands, and add one only with a reason that has been
# checked.

# @anthropic-ai/sdk: both concern the SDK's Memory Tool, which Command Centre never uses.
