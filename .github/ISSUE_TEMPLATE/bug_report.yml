name: Bug report
description: Something in Frontier Command Centre does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please do not include prompts, personal data or secrets. Report security issues privately, as SECURITY.md describes.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0, or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - Local development (npm run dev)
        - My own cloud deployment
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Hub logs (docker compose logs hub) or a screenshot, with anything sensitive removed.
