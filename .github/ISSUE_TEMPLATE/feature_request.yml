name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: Describe the change. A sketch or example helps.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you build it?
      options:
        - I would like to open a pull request for this
        - I am suggesting it for someone else to pick up
