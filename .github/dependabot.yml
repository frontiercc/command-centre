# Dependabot: alerts, plus pull requests for security fixes only.
#
# open-pull-requests-limit: 0 turns off routine version-update pull requests.
# "Dependabot security updates" is switched on in the repository's settings,
# so a known advisory gets a pull request that must pass CI before it can be
# merged. The ignore rules below apply to both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Major upgrades planned as product work, not taken automatically.
      # The advisories they would clear are recorded in osv-scanner.toml.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
