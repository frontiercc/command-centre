name: CLA

# Asks each new contributor to sign the Contributor Licence Agreement (CLA.md)
# and records signatures on the cla-signatures branch. The action never checks
# out or runs code from the pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Nothing at the top level; the one job below asks for only what it needs.
permissions: {}

jobs:
  cla:
    name: Contributor Licence Agreement
    runs-on: ubuntu-latest
    permissions:
      actions: write        # re-runs the check after someone signs
      contents: write       # records signatures on the cla-signatures branch
      pull-requests: write  # posts the "please sign" comment
      statuses: write       # sets the CLA check on the pull request
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/frontiercc/command-centre/blob/main/CLA.md
          branch: cla-signatures
          allowlist: frontiercommandcentre,dependabot[bot]
