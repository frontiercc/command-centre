name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the latest commit
      # The gitleaks command-line tool, pinned and checked against the release's
      # published checksums. The gitleaks GitHub Action needs a licence key
      # in an organisation repository; the tool itself does not.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | sed 's/ gitleaks_.*$/ gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the whole history
        run: ./gitleaks git --redact --verbose .
