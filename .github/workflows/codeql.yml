name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
      # A public repository sends the results to the Security tab. A private one
      # cannot without GitHub Advanced Security, so the results are kept as a
      # download on the run instead, and any finding fails the run.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
          output: sarif-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Keep the results
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results
          path: sarif-results
          retention-days: 30
      - name: Fail on findings not yet reviewed
        if: ${{ github.event.repository.private }}
        run: node .github/scripts/check-codeql.mjs sarif-results .github/codeql-reviewed.tsv
